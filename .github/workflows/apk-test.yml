# Builds the dev APK on GitHub's runners and hands it back as an artifact: the phone's build can't be
# made on an arm64 machine, and a pull request's CI job checks the build but keeps no APK.
name: APK for testing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: jetbrains
          java-version: "25"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build the dev APK
        run: ./gradlew --no-daemon :androidApp:assembleDev

      - name: Upload it
        uses: actions/upload-artifact@v4
        with:
          name: kyllene-dev-apk
          path: androidApp/build/outputs/apk/dev/androidApp-dev.apk
          if-no-files-found: error
          retention-days: 7
